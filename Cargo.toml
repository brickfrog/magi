[package]
name = "magi"
version = "0.1.0"
edition = "2024"
description = "A language for reproducible business-data analysis and reconciliation"
license = "MIT OR Apache-2.0"

[[bin]]
name = "magi"
path = "src/main.rs"

[dependencies]
calamine = { version = "0.36", features = ["dates"] }
clap = { version = "4.6", features = ["derive"] }
duckdb = { version = "1.10505", features = ["bundled", "parquet", "json"] }
encoding_rs = "0.8"
lsp-server = "0.10"
lsp-types = "0.95"
miette = { version = "7.6", features = ["fancy"] }
odbc-api = { version = "29.1", default-features = false, features = ["odbc_version_3_80"] }
rust_xlsxwriter = "0.99"
serde_json = "1"
strsim = "0.11"
thiserror = "2"
tempfile = "3"

[dev-dependencies]
insta = "1.48"

[profile.dev.package.libduckdb-sys]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
